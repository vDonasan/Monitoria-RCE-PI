  try { feitos = new Set(JSON.parse(localStorage.getItem(CHAVE) || "[]")); } catch (e) { /* sem armazenamento */ }
  function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify([...feitos])); } catch (e) {} }
  const totalEx = AULAS.reduce((s, a) => s + a.exercicios.length, 0);
  const feitosDaAula = a => a.exercicios.filter((_, i) => feitos.has(a.id + ":" + i)).length;

  /* ---------- utilidades ---------- */
  const el = (tag, attrs = {}, html) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
    }
    if (html != null) n.innerHTML = html;
    return n;
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function realcar(codigo, lang) {
    const g = window.Prism && Prism.languages[lang];
    return g ? Prism.highlight(codigo, g, lang) : esc(codigo);
  }
  function avisar(txt) {
    const a = document.getElementById("aviso");
    a.textContent = txt; a.classList.add("ver");
    clearTimeout(avisar.t); avisar.t = setTimeout(() => a.classList.remove("ver"), 1800);
  }
  async function copiar(texto) {
    try { await navigator.clipboard.writeText(texto); avisar("Código copiado"); }
    catch (e) { avisar("Não deu para copiar. Selecione o código e use Ctrl+C."); }
  }
  // envolve tabelas da prosa num contêiner que rola na horizontal
  function ajustarTabelas(raiz) {
    raiz.querySelectorAll("table.tabela").forEach(t => {
      if (t.parentElement.classList.contains("rolar")) return;
      const w = el("div", { class: "rolar" }); t.replaceWith(w); w.appendChild(t);
    });
  }

  function blocoCodigo(codigo, lang, rotulo) {
    const box = el("div", { class: "codigo" });
    const topo = el("div", { class: "codigo-topo" });
    topo.appendChild(el("span", { text: rotulo || ARQUIVO[lang] || "" }));
    if (lang !== "texto") {
      const b = el("button", { class: "botao", type: "button", text: "Copiar" });
      b.addEventListener("click", () => copiar(codigo));
      topo.appendChild(b);
    }
    box.appendChild(topo);
    const pre = el("pre"); const c = el("code");
    c.innerHTML = lang === "texto" ? esc(codigo) : realcar(codigo, lang);
    pre.appendChild(c); box.appendChild(pre);
    return box;
  }

  function terminal(ex) {
    const t = el("div", { class: "terminal", role: "group", "aria-label": "Saída ao executar" });
    if (ex.terminal && ex.terminal.length) {
      t.innerHTML = ex.terminal.map(([tipo, txt]) =>
        tipo === "in" ? `<span class="in" title="digitado pelo usuário">${esc(txt.replace(/\n$/, ""))}</span>\n` : esc(txt)
      ).join("").replace(/\n+$/, "");
    } else {
      t.textContent = (ex.saida || "").replace(/\n+$/, "");
    }
    return t;
  }

  /* ---------- tabela verdade ---------- */
  function montarVerdade(alvo) {
    let A = 1, B = 0;
    alvo.innerHTML = `
      <div class="entradas" role="group" aria-label="Valores de entrada">
        <button type="button" class="chave" data-v="A"></button>
        <button type="button" class="chave" data-v="B"></button>
      </div>
      <dl aria-live="polite">
        <dt>A &amp;&amp; B</dt><dt>A || B</dt><dt>!A</dt>
        <dd data-r="e"></dd><dd data-r="ou"></dd><dd data-r="nao"></dd>
      </dl>`;
    const pinta = (dd, v) => { dd.textContent = v; dd.className = "v" + v; };
    function atualizar() {
      alvo.querySelectorAll(".chave").forEach(b => {
        const v = b.dataset.v === "A" ? A : B;
        b.textContent = `${b.dataset.v} = ${v}`;
        b.setAttribute("aria-pressed", v ? "true" : "false");
      });
      pinta(alvo.querySelector('[data-r="e"]'), A && B ? 1 : 0);
      pinta(alvo.querySelector('[data-r="ou"]'), A || B ? 1 : 0);
      pinta(alvo.querySelector('[data-r="nao"]'), A ? 0 : 1);
    }
    alvo.addEventListener("click", e => {
      const b = e.target.closest(".chave"); if (!b) return;
      if (b.dataset.v === "A") A = 1 - A; else B = 1 - B;
      atualizar();
    });
    atualizar();
  }

  /* ---------- teste de mesa ---------- */
  function montarMesa(tr) {
    const linhas = tr.codigo.split("\n");
    const caixa = el("div", { class: "mesa", tabindex: "0", "aria-label": "Teste de mesa interativo. Use as setas para avançar e voltar." });
    const realce = realcar(tr.codigo, tr.lang).split("\n");
    caixa.innerHTML = `
      <div class="mesa-corpo">
        <div class="mesa-codigo">${linhas.map((_, i) =>
          `<div class="ln" data-l="${i + 1}"><span class="num">${i + 1}</span><code>${realce[i] || " "}</code></div>`).join("")}</div>
        <div class="mesa-lado">
          <p class="mesa-nota" aria-live="polite"></p>
          <div class="mesa-tab-wrap"><table class="mesa-tab">
            <thead><tr><th class="passo">passo</th>${tr.vars.map(v => `<th>${esc(v)}</th>`).join("")}</tr></thead>
            <tbody></tbody></table></div>
          <div class="mesa-saida"></div>
        </div>
      </div>
      <div class="mesa-controles">
        <button type="button" class="botao" data-a="ini">Recomeçar</button>
        <button type="button" class="botao" data-a="ant">Voltar</button>
        <button type="button" class="botao ativo" data-a="prox">Próximo passo</button>
        <span class="contador"></span>
      </div>`;
    let p = 0;
    const N = tr.passos.length;
    const tbody = caixa.querySelector("tbody");
    const wrap = caixa.querySelector(".mesa-tab-wrap");
    function desenhar() {
      caixa.querySelectorAll(".ln").forEach(l => l.classList.toggle("atual", +l.dataset.l === tr.passos[p].l));
      caixa.querySelector(".mesa-nota").innerHTML = tr.passos[p].n;
      let saida = "", linhasTab = "";
      for (let i = 0; i <= p; i++) {
        const s = tr.passos[i];
        if (s.o) saida += s.o;
        const muda = Object.keys(s.v);
        if (muda.length) {
          linhasTab += `<tr class="${i === p ? "atual" : ""}"><td class="passo">${i + 1}</td>${tr.vars.map(v =>
            muda.includes(v) ? `<td class="mudou">${s.v[v]}</td>` : "<td></td>").join("")}</tr>`;
        }
      }
      tbody.innerHTML = linhasTab;
      wrap.scrollTop = wrap.scrollHeight;
      caixa.querySelector(".mesa-saida").textContent = saida;
      caixa.querySelector(".contador").textContent = `Passo ${p + 1} de ${N}`;
      caixa.querySelector('[data-a="ant"]').disabled = p === 0;
      caixa.querySelector('[data-a="ini"]').disabled = p === 0;
      caixa.querySelector('[data-a="prox"]').disabled = p === N - 1;
    }
    caixa.addEventListener("click", e => {
      const b = e.target.closest("button[data-a]"); if (!b) return;
      if (b.dataset.a === "prox" && p < N - 1) p++;
      if (b.dataset.a === "ant" && p > 0) p--;
      if (b.dataset.a === "ini") p = 0;
      desenhar();
    });
    caixa.addEventListener("keydown", e => {
      if (e.key === "ArrowRight" && p < N - 1) { p++; desenhar(); e.preventDefault(); }
      if (e.key === "ArrowLeft" && p > 0) { p--; desenhar(); e.preventDefault(); }
    });
    desenhar();
    return caixa;
  }

  /* ---------- trilha lateral ---------- */
  const fracao = (f, t) => `<span class="fr${t && f === t ? " completo" : ""}" title="exercícios feitos">${f}/${t}</span>`;

  function desenharTrilha(atual) {
    const lista = document.getElementById("lista-modulos");
    lista.innerHTML = "";
    lista.appendChild(el("div", { class: "modulo-nome" }, `<span class="pino pino-${PAGINA.id}"></span>Aulas`));
    const ol = el("ol");
    AULAS.forEach((a, i) => {
      ol.appendChild(el("li", {}, `<a href="#${a.id}"${a.id === atual ? ' aria-current="page"' : ""}>
        <span class="n">${i + 1}</span><span>${esc(a.titulo)}</span>${fracao(feitosDaAula(a), a.exercicios.length)}</a>`));
    });
    lista.appendChild(ol);
    const tot = AULAS.reduce((s, a) => s + feitosDaAula(a), 0);
    document.getElementById("prog-txt").textContent = `${tot} de ${totalEx} exercícios feitos`;
    document.getElementById("prog-barra").style.width = (100 * tot / totalEx) + "%";
  }

  /* ---------- página inicial ---------- */
  function paginaInicio() {
    const c = document.getElementById("conteudo");
    const porNivel = [1, 2, 3].map(n => AULAS.reduce((s, a) => s + a.exercicios.filter((e, i) => nivelDe(e, i, a.exercicios.length) === n).length, 0));
    c.innerHTML = `
      <h1>${esc(PAGINA.nome)}</h1>
      <p class="resumo">${PAGINA.descricao}</p>
      <dl class="ficha">
        <div><dt>Nível</dt><dd>${esc(PAGINA.nivel)}</dd></div>
        <div><dt>Aulas</dt><dd>${AULAS.length}</dd></div>
        <div><dt>Exercícios</dt><dd>${totalEx}: ${porNivel[0]} fáceis, ${porNivel[1]} médios, ${porNivel[2]} desafios</dd></div>
      </dl>
      <section class="bloco">
        <h2>O que você vai aprender</h2>
        <div class="inicio-modulos"><div class="inicio-modulo"><ol id="lista-aulas"></ol></div></div>
      </section>
      <section class="bloco prosa">
        <h2>Como estudar</h2>
        <ol class="passos">
          <li>Siga as aulas na ordem: cada uma usa o que veio antes.</li>
          <li>Leia a ideia com calma. As comparações com o dia a dia estão ali para você ter uma imagem na cabeça antes do código.</li>
          <li>Copie o exemplo, rode no seu computador e confira a saída. Depois mude alguma coisa e veja o que acontece.</li>
          <li>Leia a explicação linha por linha do exemplo e as pegadinhas. Elas mostram os erros que quase todo mundo comete.</li>
          <li>Faça os exercícios do fácil para o desafio. Tente sem abrir nada; se travar por mais de 10 minutos, abra a dica.</li>
          <li>Só depois de tentar, compare com a solução e marque como feito.</li>
        </ol>
      </section>
      <section class="bloco prosa">
        <h2>Como rodar os exemplos</h2>
        ${PAGINA.comoRodar}
      </section>
      <p class="selo">Todos os exemplos e soluções em código foram executados antes de serem publicados. As saídas mostradas nas aulas são as reais. O seu progresso fica salvo só neste navegador.</p>`;
    ajustarTabelas(c);
    const ol = c.querySelector("#lista-aulas");
    AULAS.forEach((a, i) => {
      ol.appendChild(el("li", {}, `<a href="#${a.id}"><span class="n">${i + 1}</span>
        <span><span class="t">${esc(a.titulo)}</span><span class="r">${esc(a.resumo)}</span></span>
        ${fracao(feitosDaAula(a), a.exercicios.length)}</a>`));
    });
  }

  /* ---------- página da aula ---------- */
  function paginaAula(a) {
    const idx = AULAS.indexOf(a);
    const c = document.getElementById("conteudo");
    c.innerHTML = "";

    c.appendChild(el("p", { class: "contexto" },
      `<a href="#inicio">${esc(PAGINA.nome)}</a>, aula ${idx + 1} de ${AULAS.length}`));
    c.appendChild(el("h1", { text: a.titulo }));
    c.appendChild(el("p", { class: "resumo", text: a.resumo }));

    // A ideia
    const ideia = el("section", { class: "bloco prosa" });
    ideia.appendChild(el("h2", { text: "A ideia" }));
    const corpo = el("div", {}, a.ideia);
    ideia.appendChild(corpo);
    corpo.querySelectorAll('[data-widget="verdade"]').forEach(montarVerdade);
    if (a.trace) {
      corpo.appendChild(montarMesa(a.trace));
    }
    ajustarTabelas(ideia);
    c.appendChild(ideia);

    // Exemplos
    if (a.exemplos.length) {
      const sec = el("section", { class: "bloco" });
      sec.appendChild(el("h2", { text: a.exemplos.length > 1 ? "Exemplos" : "Exemplo" }));
      for (const ex of a.exemplos) {
        const box = el("div", { class: "exemplo" });
        box.appendChild(el("h3", { text: ex.titulo }));
        box.appendChild(blocoCodigo(ex.codigo, ex.lang));
        if (ex.saida || (ex.terminal && ex.terminal.length)) box.appendChild(terminal(ex));
        if (ex.nota) box.appendChild(el("p", { class: "nota", text: ex.nota }));
        if (ex.explica && ex.explica.length) {
          const exp = el("div", { class: "explica" });
          exp.appendChild(el("h4", { text: "Entendendo o código" }));
          const ul = el("ul");
          ex.explica.forEach(t => ul.appendChild(el("li", {}, t)));
          exp.appendChild(ul);
          box.appendChild(exp);
        }
        sec.appendChild(box);
      }
      c.appendChild(sec);
    }

    // Pegadinhas
    const peg = el("section", { class: "bloco" });
    peg.appendChild(el("h2", { text: "Pegadinhas" }));
    const ul = el("ul", { class: "pegadinhas" });
    a.pegadinhas.forEach(p => ul.appendChild(el("li", {}, p)));
    peg.appendChild(ul);
    c.appendChild(peg);

    // Para lembrar
    const lem = el("aside", { class: "bloco lembrar", "aria-label": "Para lembrar" });
    lem.appendChild(el("h2", { text: "Para lembrar" }));
    const ul2 = el("ul");
    a.lembrar.forEach(p => ul2.appendChild(el("li", {}, p)));
    lem.appendChild(ul2);
    c.appendChild(lem);

    // Exercícios
    const exs = el("section", { class: "bloco" });
    exs.appendChild(el("h2", { text: "Exercícios" }));
    const lista = el("div", { class: "exercicios" });
    a.exercicios.forEach((ex, i) => {
      const chave = a.id + ":" + i;
      const card = el("article", { class: "exercicio" + (feitos.has(chave) ? " feito" : "") });
      const idChk = `feito-${a.id}-${i}`;
      card.innerHTML = `
        <div class="ex-topo">
          <h3>${i + 1}. ${esc(ex.titulo)} <span class="nivel nivel-${nivelDe(ex, i, a.exercicios.length)}">${NIVEIS[nivelDe(ex, i, a.exercicios.length)]}</span></h3>
          <label class="feito-check" for="${idChk}"><input type="checkbox" id="${idChk}"${feitos.has(chave) ? " checked" : ""}> Já fiz</label>
        </div>
        <p>${ex.enunciado}</p>`;
      if (ex.trecho) {
        const t = el("div", { class: "ex-trecho" });
        t.appendChild(blocoCodigo(ex.trecho, ex.trechoLang || "c", "trecho para analisar"));
        card.appendChild(t);
      }
      const acoes = el("div", { class: "ex-acoes" });
      const bDica = el("button", { class: "botao", type: "button", "aria-expanded": "false", text: "Mostrar dica" });
      const bSol = el("button", { class: "botao", type: "button", "aria-expanded": "false", text: "Mostrar solução" });
      acoes.append(bDica, bSol);
      card.appendChild(acoes);
      const dica = el("div", { class: "revelar dica", hidden: "" }, `<strong>Dica.</strong> ${ex.dica}`);
      const sol = el("div", { class: "revelar", hidden: "" });
      sol.appendChild(blocoCodigo(ex.solucao, ex.lang, ex.lang === "texto" ? "resposta" : "solução: " + ARQUIVO[ex.lang]));
      card.append(dica, sol);
      const alternar = (btn, painel, rotuloVer, rotuloEsconder) => () => {
        const abrir = painel.hidden;
        painel.hidden = !abrir;
        btn.setAttribute("aria-expanded", abrir ? "true" : "false");
        btn.textContent = abrir ? rotuloEsconder : rotuloVer;
      };
      bDica.addEventListener("click", alternar(bDica, dica, "Mostrar dica", "Esconder dica"));
      bSol.addEventListener("click", alternar(bSol, sol, "Mostrar solução", "Esconder solução"));
      card.querySelector("input").addEventListener("change", e => {
        if (e.target.checked) feitos.add(chave); else feitos.delete(chave);
        card.classList.toggle("feito", e.target.checked);
        salvar(); desenharTrilha(a.id);
      });
      lista.appendChild(card);
    });
    exs.appendChild(lista);
    c.appendChild(exs);

    // anterior / próxima
    const nav = el("nav", { class: "navegar", "aria-label": "Outras aulas" });
    if (idx > 0) {
      const ant = AULAS[idx - 1];
      nav.appendChild(el("a", { href: "#" + ant.id }, `<small>Aula anterior</small><strong>${esc(ant.titulo)}</strong>`));
    }
    if (idx < AULAS.length - 1) {
      const prox = AULAS[idx + 1];
      nav.appendChild(el("a", { href: "#" + prox.id, class: "prox" }, `<small>Próxima aula</small><strong>${esc(prox.titulo)}</strong>`));
    }
    c.appendChild(nav);
  }

  /* ---------- roteamento pelo # ---------- */
  function rota() {
    const id = location.hash.slice(1);
    const aula = AULAS.find(a => a.id === id);
    if (aula) { paginaAula(aula); document.title = aula.titulo + " | " + PAGINA.nome; }
    else { paginaInicio(); document.title = PAGINA.nome; }
    desenharTrilha(aula ? aula.id : null);
    document.getElementById("trilha").classList.remove("aberta");
    const bt = document.getElementById("abrir-trilha");
    bt.setAttribute("aria-expanded", "false");
    bt.textContent = "Ver a lista";
    window.scrollTo(0, 0);
  }
  document.getElementById("abrir-trilha").addEventListener("click", e => {
    const t = document.getElementById("trilha");
    const aberta = t.classList.toggle("aberta");
    e.currentTarget.setAttribute("aria-expanded", aberta ? "true" : "false");
    e.currentTarget.textContent = aberta ? "Fechar a lista" : "Ver a lista";
  });
  window.addEventListener("hashchange", () => { rota(); document.getElementById("folha").focus({ preventScroll: true }); });
  rota();
})();
</script>
</body>
</html>
